apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mini.fullname" . }}
  labels:
    {{- include "mini.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  template:
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (printf "%s-app" .Release.Name) }}
