[project]
name = "{{cookiecutter.project_name}}"
version = "0.1.0"
description = "mini agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=1.0.0,<2.0.0",
{%- if cookiecutter.runtime == "langgraph-server" %}
    "langgraph-cli[inmem]>=0.2.10,<1.0.0",
{%- else %}
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn>=0.34,<1.0",
{%- endif %}
{%- if cookiecutter.model_provider == "anthropic" %}
    "langchain-anthropic>=1.0,<2.0",
{%- else %}
    "langchain-openai>=1.0,<2.0",
{%- endif %}
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["{{cookiecutter.agent_directory}}"]
