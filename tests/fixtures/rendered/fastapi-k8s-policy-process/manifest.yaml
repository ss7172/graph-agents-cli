name: 'p5-policy'
cli_version: '0.1.0'
agent_directory: 'app'
base_template: 'langgraph'
generated_at: <generated_at>
language: 'python'
create_params:
  deployment_target: 'kubernetes'
  runtime: 'fastapi'
  model_provider: 'openai'
  model: 'gpt-5-mini'
  checkpointer: 'postgres'
  registry: 'ghcr.io/e2e'
  cd: 'skip'
  auth_policy: 'shared-bearer'
