  auth_policy_implemented: true
  agent_guidance_filename: 'GEMINI.md'
environments:
  dev: { context: "", namespace: p5-policy-dev }
  staging: { context: "", namespace: p5-policy-staging }
  prod: { context: "", namespace: p5-policy-prod }
secrets:
  # Only these keys are exported from an env file into the environment's Secret.
  keys: [OPENAI_API_KEY, JUDGE_API_KEY, POSTGRES_DSN, API_KEY, LANGSMITH_API_KEY, PRODUCT_API_TOKEN]
  # Team or role responsible for provisioning and rotating the Secret (free text).
  owner: ""
product_api:
  policy_file: product-policy.yaml
process: docs/process.md
