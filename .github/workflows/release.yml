# Release graph-agents-cli from a version tag.
#
# Pushing a tag `vX.Y.Z` (the owner does this; see CONTRIBUTING.md, "Release
# process"):
#   1. verify         the tag equals the package version, and so do the plugin
#                     manifests and the skills' metadata.version; CHANGELOG.md
#                     has a section for it
#   2. test           ruff and the fast test suite
#   3. build          sdist and wheel (uv build); the wheel must install and
#                     report the tagged version
#   4. github-release a GitHub Release for the tag with the sdist, the wheel,
#                     SHA256SUMS and the CHANGELOG section as notes
#   5. pypi           OFF by default: runs only when the repository variable
#                     PUBLISH_TO_PYPI is 'true'. PyPI trusted publishing (OIDC,
#                     no token) from the `pypi` environment.
#
# Until PyPI publishing is enabled, users install the tag from git:
#   uv tool install git+https://github.com/ss7172/graph-agents-cli@vX.Y.Z
#
# Actions are pinned to full commit SHAs (the version is in the comment).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRAPH_AGENTS_CLI_NO_UPDATE_CHECK: "1"
  UV_VERSION: "0.9.2"

jobs:
  verify:
    name: tag matches the package version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with every version the release carries
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "Tag: ${TAG}  pyproject.toml version: ${version}"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error file=pyproject.toml::Tag ${TAG} does not match the package version ${version} (expected tag v${version})."
            exit 1
          fi
          failed=0
          for manifest in plugin.json .claude-plugin/plugin.json gemini-extension.json; do
            found="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' "${manifest}")"
            if [ "${found}" != "${version}" ]; then
              echo "::error file=${manifest}::version is ${found}, expected ${version}."
              failed=1
            fi
          done
          for skill in skills/graph-agents-cli-*/SKILL.md; do
            if ! grep -qx "  version: \"${version}\"" "${skill}"; then
              echo "::error file=${skill}::metadata.version is not \"${version}\"."
              failed=1
            fi
          done
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [${version}]' section."
            failed=1
          fi
          [ "${failed}" = 0 ] || exit 1
          case "${version}" in
            *a*|*b*|*rc*|*dev*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  test:
    name: lint and fast tests
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in the release workflow: a cache written by
      # another workflow must not be able to change what gets released.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - name: Install the project and the dev dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run --locked ruff check .

      - name: ruff format --check
        run: uv run --locked ruff format --check .

      - name: Fast test suite
        run: uv run --locked pytest -q -m "not slow" -p no:cacheprovider

  build:
    name: build sdist and wheel
    needs: [verify, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - name: Build
        run: uv build --out-dir dist

      - name: The wheel installs and reports the tagged version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          wheel="$(ls dist/*.whl)"
          reported="$(uv tool run --isolated --from "${wheel}" graph-agents-cli --version)"
          echo "${reported}"
          case "${reported}" in
            *"version ${VERSION}") ;;
            *) echo "::error::The wheel reports '${reported}', expected version ${VERSION}."; exit 1 ;;
          esac

      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Release notes: the CHANGELOG.md section of this version.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          flags=()
          if [ "${PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" dist/* SHA256SUMS \
            --verify-tag \
            --title "graph-agents-cli ${VERSION}" \
            --notes-file release-notes.md \
            "${flags[@]}"

  pypi:
    name: publish to PyPI (opt-in)
    needs: [verify, build, github-release]
    # Off by default. The owner enables it by (1) registering this workflow
    # (release.yml, environment `pypi`) as a trusted publisher of the
    # graph-agents-cli project on PyPI and (2) setting the repository variable
    # PUBLISH_TO_PYPI to 'true'. Expression comparisons ignore case and `vars`
    # includes organization variables, so the first step re-checks the exact
    # value; the `pypi` environment's required reviewers are the human gate.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/graph-agents-cli/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Require PUBLISH_TO_PYPI to be exactly 'true'
        env:
          PUBLISH_TO_PYPI: ${{ vars.PUBLISH_TO_PYPI }}
        run: |
          if [ "${PUBLISH_TO_PYPI}" != "true" ]; then
            echo "::error::PUBLISH_TO_PYPI is '${PUBLISH_TO_PYPI}', not exactly 'true'; nothing was published."
            exit 1
          fi

      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
