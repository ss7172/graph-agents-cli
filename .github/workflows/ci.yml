# Continuous integration for graph-agents-cli itself (not the projects it generates).
#
# - `checks` runs on every pull request and every push to main: ruff check,
#   ruff format --check and the fast test suite (no network, no cluster, no
#   model key) on each supported Python version.
# - `e2e` runs nightly and on demand: the slow tests, which install rendered
#   projects with uv, drive the CLI end to end through subprocesses
#   (GRAPH_AGENTS_CLI_E2E=1) and run helm against the rendered charts. It needs
#   network (PyPI, and registry-1.docker.io for the chart's subcharts) but never
#   a cluster: every kubectl/helm-mutating path is a dry run.
#
# Actions are pinned to full commit SHAs (the version is in the comment); bump
# them deliberately. The uv version matches the one the bundled template locks
# are generated with (see CONTRIBUTING.md).

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRAPH_AGENTS_CLI_NO_UPDATE_CHECK: "1"
  UV_VERSION: "0.9.2"

jobs:
  checks:
    name: lint and fast tests (Python ${{ matrix.python }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install the project and the dev dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run --locked ruff check .

      - name: ruff format --check
        run: uv run --locked ruff format --check .

      # Includes the docs-parity checks: every command's --help, the skills
      # bundle byte-identical to skills/, the rendered-project snapshots.
      - name: Fast test suite
        run: uv run --locked pytest -q -m "not slow" -p no:cacheprovider

  e2e:
    name: end-to-end and template tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRAPH_AGENTS_CLI_E2E: "1"
      UV_NO_CONFIG: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Tool versions
        run: |
          uv --version
          helm version --short
          git --version

      - name: Install the project and the dev dependencies
        run: uv sync --locked

      - name: Slow suite (E2E and rendered-template tests)
        run: uv run --locked pytest -q -m slow -p no:cacheprovider
