# Read by the CLI when the template is selected; never copied into the
# generated project, because the overlay skips .template/.
name: "langgraph"
description: "LangGraph ReAct agent served over a chat SSE API and A2A, with a FastAPI or LangGraph Server runtime, Postgres persistence, and a Helm chart"
# empty_py leaves out any agent layer, so this template supplies its own
# agent, server, tests, dependency locks and deployment files.
base_template: "empty_py"
example_question: "What's the weather in San Francisco?"
settings:
  language: "python"
  deployment_targets: ["kubernetes", "none"]
  agent_directory: "app"
  tags: ["langgraph", "a2a"]
