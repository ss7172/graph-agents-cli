# Outbound API access policy for {{cookiecutter.project_name}}.
#
# Declares every external API the agent's tools may call, and how. Owned by the
# project: `graph-agents-cli scaffold upgrade` and `enhance` never overwrite it.
# Change it with `graph-agents-cli api ...` (add, access, allow, deny, revoke,
# limits, remove; each prints the diff first) or by hand, in a reviewed pull
# request: CODEOWNERS covers this file. Widening access (more methods, more
# operations, a lifted denial) needs that review; narrowing it is always safe.
# `{{cookiecutter.agent_directory}}/app_utils/api_client.py` loads it (path from
# API_POLICY_PATH, default ./api-policy.yaml) and refuses, before sending, any
# request outside it; without this file every outbound call is refused.
# `graph-agents-cli lint` (or `graph-agents-cli api check`) checks every tool's
# API_CALLS against it with the same rules. Unknown and repeated keys are errors
# at every level, so a typo never widens access.
#
# The sample below declares one read-write API with an explicit allow-list and a
# denial. There is no default access level: choose each API's methods and
# operations (`graph-agents-cli api add --access read-only|read-write|custom`).
apis:
  orders:                                   # [a-z][a-z0-9_]*, at most 32 characters
    base_url_env: ORDERS_API_BASE_URL       # required; the URL may carry a path prefix
    auth: bearer                            # required: none | bearer | forward
    token_env: ORDERS_API_TOKEN             # required iff auth: bearer (joins secrets.keys)
    # forward_header: Authorization         # auth: forward only: sends the caller's
    #                                       # attributes["credentials"]["orders"]
    allowed_methods: [GET, HEAD, POST, PUT, PATCH, DELETE]  # required, explicit; ["*"] = every method
    allowed_operations:                     # optional; omit = every operation within
      - operationId: listOrders             # allowed_methods. An entry pinning both
        path: /orders                       # operationId and path needs both to match.
        methods: [GET]
      - operationId: getOrder
        path: /orders/{order_id}
        methods: [GET]
      - operationId: createOrder
        path: /orders
        methods: [POST]
      - operationId: updateOrder
        path: /orders/{order_id}
        methods: [PATCH]
    denied_operations:                      # same entry shape; denials win and fail closed:
      - operationId: deleteOrder            # a call that does not name a field a denial
        path: /orders/{order_id}            # pins is refused by it (name operation_id on
        methods: [DELETE]                   # every call, or pin `path` in the denial).
    # openapi: docs/orders-openapi.yaml     # optional; lint validates declared calls against it
    timeouts_ms: {connect: 2000, read: 5000}
    pagination: {page_size_param: pageSize, max_page_size: 200}  # enforced at runtime
    limits: {max_calls_per_run: 20, rate_per_minute: 120}      # optional; per run / per replica
    # approval: reserved for human approval of calls (planned; refused until then)
