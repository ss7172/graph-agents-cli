# Product API access policy for {{cookiecutter.project_name}} (DECISIONS.md D28).
#
# Owned by the product, never overwritten by `graph-agents-cli scaffold upgrade`.
# `{{cookiecutter.agent_directory}}/app_utils/product_client.py` loads this file once at startup
# (path from PRODUCT_POLICY_PATH, default ./product-policy.yaml) and refuses,
# before sending, any request whose method or operation is outside it.
# `graph-agents-cli lint` checks every tool's PRODUCT_CALLS declaration against it.
#
# This file was seeded by `graph-agents-cli create --product-policy`; replace the
# example values with the product's own.
product_api:
  base_url_env: PRODUCT_API_BASE_URL
  # forwarded-session | bearer | none
  auth: bearer
  token_env: PRODUCT_API_TOKEN            # bearer only
  allowed_methods: [GET]                  # omit or [] = every method
  allowed_operations:                     # optional allow-list; omit = every operation
    - operationId: getItem
    - path: /items/{item_id}
      methods: [GET]
  denied_operations: []                   # explicit denials win over allows
  # openapi: docs/product-openapi.yaml    # optional; enables static validation in lint
  timeouts_ms: {connect: 2000, read: 5000}
  pagination: {page_size_param: pageSize, max_page_size: 200}
