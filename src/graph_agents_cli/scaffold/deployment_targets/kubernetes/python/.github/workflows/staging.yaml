# On every push to main: build and push the image tagged with the SHORT commit
# SHA (${GITHUB_SHA::7}, the same value `git rev-parse --short HEAD` gives a
# workstation `graph-agents-cli deploy --env <env>` in argocd mode), then land
# it in staging according to CD in .github/agent.env (D12):
#   argocd:    update values-staging.yaml image.tag and open a PR with auto-merge
#   helm-push: run `graph-agents-cli deploy --env staging --image ...` on a
#              self-hosted runner that holds the kubeconfig as a repository secret
# This file is copied verbatim into the project (not rendered).

name: staging

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      cd: ${{ steps.settings.outputs.cd }}
      tag: ${{ steps.settings.outputs.tag }}
      image: ${{ steps.settings.outputs.image }}
      chart_path: ${{ steps.settings.outputs.chart_path }}
      cli_version_pin: ${{ steps.settings.outputs.cli_version_pin }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load project settings
        id: settings
        run: |
          set -a; . .github/agent.env; set +a
          TAG="${GITHUB_SHA::7}"
          echo "cd=${CD}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "chart_path=${CHART_PATH}" >> "$GITHUB_OUTPUT"
          echo "cli_version_pin=${CLI_VERSION_PIN}" >> "$GITHUB_OUTPUT"
          echo "REGISTRY_HOST=${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE_REPOSITORY}:${TAG}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        # GHCR works with the workflow token; other registries take REGISTRY_USERNAME / REGISTRY_PASSWORD secrets.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  land_argocd:
    # Pull-based: write the desired state and let Argo CD reconcile from main.
    needs: build
    if: needs.build.outputs.cd == 'argocd'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # A pull request opened with the workflow token does not trigger pr_checks
      # (GitHub never starts workflows from GITHUB_TOKEN events), so auto-merge
      # would wait forever on a required check. Store a fine-grained PAT or a
      # GitHub App token as the GH_PR_TOKEN repository secret to lift that limit.
      GH_TOKEN: ${{ secrets.GH_PR_TOKEN || secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
      IMAGE: ${{ needs.build.outputs.image }}
      CHART_PATH: ${{ needs.build.outputs.chart_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update the staging image tag
        run: |
          yq -i '.image.tag = strenv(TAG)' "${CHART_PATH}/values-staging.yaml"
          git diff --stat

      - name: Open the staging PR with auto-merge
        # Same branch name as a workstation `graph-agents-cli deploy --env staging`
        # (deploy/<env>/<short sha>). Requires branch protection on main to permit
        # auto-merge for the token (ASSUMPTIONS item 21) and pr_checks to be green.
        # The branch is bot-owned and deterministic (same sha -> same content), so a
        # re-run replaces it: actions/checkout is a shallow clone with no
        # origin/<branch> ref, and a bare --force-with-lease is rejected ("stale
        # info") once the branch exists. The PR is created only when none is open.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="deploy/staging/${TAG}"
          git checkout -b "$BRANCH"
          git add "${CHART_PATH}/values-staging.yaml"
          git commit -m "deploy(staging): image ${IMAGE}"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "deploy(staging): ${TAG}" \
              --body "Automated staging promotion of ${IMAGE}. Merges automatically once pr_checks passes."
          fi
          # --auto merges directly when already mergeable and is a no-op once merged;
          # an "already enabled" rejection of the enable mutation is a success too.
          gh pr merge --auto --squash "$BRANCH" \
            || [ -n "$(gh pr view "$BRANCH" --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // empty')" ]

  deploy_helm_push:
    # Push-based: a self-hosted runner inside the network runs helm through the CLI.
    needs: build
    if: needs.build.outputs.cd == 'helm-push'
    runs-on: self-hosted
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Configure kubeconfig
        run: |
          install -m 0700 -d "$HOME/.kube"
          printf '%s' "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
          chmod 0600 "$HOME/.kube/config"

      - name: Deploy to staging
        # `deploy --image` in helm-push mode runs helm only (the image is already pushed).
        env:
          GRAPH_AGENTS_CLI_NO_UPDATE_CHECK: "1"
          IMAGE: ${{ needs.build.outputs.image }}
          CLI_VERSION_PIN: ${{ needs.build.outputs.cli_version_pin }}
        run: |
          uvx "graph-agents-cli${CLI_VERSION_PIN}" deploy --env staging --image "$IMAGE"
