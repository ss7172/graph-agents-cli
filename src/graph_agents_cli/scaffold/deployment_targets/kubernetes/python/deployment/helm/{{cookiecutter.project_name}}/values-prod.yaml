# prod: external Postgres (POSTGRES_DSN / DATABASE_URI from the Secret), gateway on.
# Changes to this file reach the cluster only through a reviewed pull request.
env:
  APP_ENV: prod
# The app Secret is required: without it the pods do not start (no keys).
secretOptional: false
postgresql:
  enabled: false
{%- if cookiecutter.runtime == 'langgraph-server' %}
redis:
  enabled: false           # REDIS_URI from the Secret
{%- endif %}
gateway:
  enabled: true
  hostname: ""
  parentRef:
    name: ""
    namespace: ""
image:
  # Promoted by promote-to-prod (argocd mode) or passed with `deploy --image` (helm-push).
  # Empty until the first promotion: the chart refuses to render without a tag.
  tag: ""
replicaCount: 2
pdb:
  enabled: true
  minAvailable: 1
topologySpread:
  enabled: true
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
# CPU autoscaling (needs metrics-server). While enabled the HPA owns the
# replica count; minReplicas stays above pdb.minAvailable so node drains can
# proceed:
# hpa:
#   enabled: true
#   minReplicas: 2
#   maxReplicas: 10
#   targetCPU: 70
