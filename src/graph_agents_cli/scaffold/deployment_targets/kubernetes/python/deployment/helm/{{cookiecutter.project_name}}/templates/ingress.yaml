{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if or .Values.tls.existingSecret .Values.tls.certManager.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.hostname is required for TLS" .Values.ingress.hostname | quote }}
      secretName: {{ include "agent.tlsSecretName" . }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.hostname }}
      host: {{ .Values.ingress.hostname | quote }}
      {{- end }}
      # Only the agent's API (route.publicPaths, plus route.devPaths under
      # APP_ENV=dev): /health, /ready and /metrics are not published.
      http:
        paths:
          {{- range (include "agent.publicPaths" . | fromYamlArray) }}
          - path: {{ .path | quote }}
            pathType: {{ ternary "Exact" "Prefix" (eq .type "Exact") }}
            backend:
              service:
                name: {{ include "agent.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
{{- end }}
