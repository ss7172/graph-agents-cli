{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "gateway.parentRef.name is required when gateway.enabled (the Gateway to attach to)" .Values.gateway.parentRef.name }}
      {{- if .Values.gateway.parentRef.namespace }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
      {{- end }}
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
    # Only the agent's API (route.publicPaths, plus route.devPaths under
    # APP_ENV=dev): /health, /ready and /metrics are not published.
    - matches:
        {{- range (include "agent.publicPaths" . | fromYamlArray) }}
        - path:
            type: {{ .type }}
            value: {{ .path | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "agent.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
