{{- if .Values.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  secretName: {{ include "agent.tlsSecretName" . }}
  dnsNames:
    - {{ required "a hostname (gateway.hostname or ingress.hostname) is required for cert-manager" (include "agent.hostname" .) | quote }}
  issuerRef:
    name: {{ required "tls.certManager.issuerRef.name is required" .Values.tls.certManager.issuerRef.name }}
    kind: {{ .Values.tls.certManager.issuerRef.kind | default "ClusterIssuer" }}
{{- end }}
