# staging: external Postgres (POSTGRES_DSN / DATABASE_URI from the Secret), gateway on.
env:
  APP_ENV: staging
# The app Secret is required: without it the pods do not start (no keys).
secretOptional: false
postgresql:
  enabled: false
{%- if cookiecutter.runtime == 'langgraph-server' %}
redis:
  enabled: false           # REDIS_URI from the Secret
{%- endif %}
gateway:
  enabled: true
  hostname: ""
  parentRef:
    name: ""
    namespace: ""
image:
  # Written by CI (argocd mode) or passed with `deploy --image` (helm-push / direct).
  # Empty until the first staging build: the chart refuses to render without a tag.
  tag: ""
replicaCount: 1
# Requests and limits come from values.yaml; override them here, for example:
# resources:
#   requests: {cpu: 250m, memory: 512Mi}
#   limits: {memory: 1Gi}
# Network isolation (off): examples/networkpolicy.yaml is a worked NetworkPolicy
# for this environment (DNS, the database, the model endpoint, the APIs in
# api-policy.yaml); copy its networkPolicy block here and set the addresses.
