{{- /*
Credentials of the bundled (dev) Postgres, read by the subchart through
postgresql.auth.existingSecret and by the agent (POSTGRES_PASSWORD).

The database volume keeps the password it was initialised with, so this Secret
must never change once created: `helm upgrade` reuses the live values (lookup),
the Secret is kept on uninstall (the volume outlives the release too), and the
dev Argo CD Application, which renders without cluster access, ignores its data
after the first sync (ignoreDifferences + RespectIgnoreDifferences). A release
whose subchart generated its own "<release>-postgresql" Secret (charts from
before this one) carries those passwords over on its first upgrade.
*/ -}}
{{- /* An empty existingSecret hands the Secret back to the subchart (generated per render). */ -}}
{{- if and .Values.postgresql.enabled .Values.postgresqlSecret.create .Values.postgresql.auth.existingSecret }}
{{- $name := include "agent.postgresql.secretName" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $previous := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgresql" .Release.Name) }}
{{- $data := dict }}
{{- if and $live $live.data }}
{{- $data = $live.data }}
{{- else if and $previous $previous.data }}
{{- $data = $previous.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
type: Opaque
data:
  password: {{ index $data "password" | default (randAlphaNum 32 | b64enc) }}
  postgres-password: {{ index $data "postgres-password" | default (randAlphaNum 32 | b64enc) }}
{{- end }}
