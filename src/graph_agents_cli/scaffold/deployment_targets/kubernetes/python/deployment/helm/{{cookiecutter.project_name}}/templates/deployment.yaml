{{- include "agent.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the non-secret configuration changes. Secret
        # rotation is a `graph-agents-cli deploy --restart`.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.service.targetPort | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent.serviceAccountName" . }}
      # The agent never calls the Kubernetes API: no token in the pod.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ include "agent.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- $shutdown := .Values.shutdown | default dict }}
          {{- if gt (int ($shutdown.preStopSleepSeconds | default 0)) 0 }}
          # Keep serving while the Service endpoints drain, then SIGTERM (see `shutdown`).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ int $shutdown.preStopSleepSeconds }}"]
          {{- end }}
          # Secrets by reference (never templated here), then the ConfigMap.
          # Required outside dev (secretOptional): no Secret, no start.
          envFrom:
            - secretRef:
                name: {{ include "agent.secretName" . }}
                optional: {{ .Values.secretOptional | default false }}
            - configMapRef:
                name: {{ include "agent.fullname" . }}
          # Chart-set variables; `env` wins over `envFrom`.
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: HOST
              value: "0.0.0.0"
            {{- if not (hasKey .Values.env "PYTHONDONTWRITEBYTECODE") }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            {{- end }}
            {{- if and (dig "readOnlyRootFilesystem" false (.Values.securityContext | default dict)) (not (hasKey .Values.env "HOME")) }}
            # The root filesystem is read-only: caches under ~ go to the /tmp emptyDir.
            - name: HOME
              value: /tmp
            {{- end }}
            {{- $appUrl := include "agent.appUrl" . }}
            {{- if $appUrl }}
            - name: APP_URL
              value: {{ $appUrl | quote }}
            {{- end }}
            - name: TRACING_ENABLED
              value: {{ .Values.tracing.enabled | quote }}
            - name: TRACE_CAPTURE
              value: {{ .Values.tracing.capture | quote }}
            {{- if .Values.tracing.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.otlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.tracing.langsmith.project }}
            - name: LANGSMITH_PROJECT
              value: {{ .Values.tracing.langsmith.project | quote }}
            {{- end }}
            {{- if eq .Values.runtime "langgraph-server" }}
            - name: LANGGRAPH_SERVER
              value: "1"
            {{- end }}
            {{- $drain := int ($shutdown.drainSeconds | default 0) }}
            {{- $drainVar := ternary "BG_JOB_SHUTDOWN_GRACE_PERIOD_SECS" "UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN" (eq .Values.runtime "langgraph-server") }}
            {{- if and (gt $drain 0) (not (hasKey .Values.env $drainVar)) }}
            # SIGTERM to exit within the grace period (see `shutdown.drainSeconds`).
            - name: {{ $drainVar }}
              value: {{ $drain | quote }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.postgresql.secretName" . }}
                  key: password
            {{- if eq .Values.runtime "langgraph-server" }}
            - name: DATABASE_URI
              value: {{ include "agent.postgresql.dsn" . | quote }}
            {{- else }}
            - name: POSTGRES_DSN
              value: {{ include "agent.postgresql.dsn" . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_URI
              value: {{ include "agent.redis.uri" . | quote }}
            {{- end }}
          # Liveness and startup: the process answers. Readiness: its database
          # answers too, so traffic stops (without a restart) while it does not.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # Writable scratch space; everything else is read-only.
        - name: tmp
          emptyDir:
            {{- with .Values.tmpVolume.medium }}
            medium: {{ . }}
            {{- end }}
            {{- with .Values.tmpVolume.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "agent.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
