# dev: a local-load cluster or a dev namespace. Bundled Postgres, no gateway.
env:
  APP_ENV: dev
postgresql:
  enabled: true
{%- if cookiecutter.runtime == 'langgraph-server' %}
redis:
  enabled: true
{%- endif %}
gateway:
  enabled: false
image:
  # Set per deploy (`graph-agents-cli deploy --env dev` passes the tag it built;
  # in argocd mode it writes it here). Empty until then: the chart refuses to
  # render without a tag rather than roll out an image that was never pushed.
  tag: ""
  pullPolicy: IfNotPresent
tracing:
  enabled: false
