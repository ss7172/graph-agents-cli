# Argo CD Application for the dev environment.
# Argo reconciles from main, so nothing reaches the cluster until a PR merges.
# The chart refuses to render until values-dev.yaml names an image tag
# (`graph-agents-cli deploy --env dev` opens the PR that sets it): until then
# Argo CD reports a comparison error and deploys nothing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{cookiecutter.project_name}}-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # CHANGE-ME: the git URL of this repository.
    repoURL: https://github.com/CHANGE-ME/{{cookiecutter.project_name}}.git
    targetRevision: main
    path: deployment/helm/{{cookiecutter.project_name}}
    helm:
      releaseName: {{cookiecutter.project_name}}
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{cookiecutter.project_name}}-dev
  # The bundled Postgres's credentials Secret is generated on the first sync
  # (Argo CD renders without cluster access, so every render would otherwise
  # produce a new password the database volume no longer accepts): keep the
  # live values. Only exists when postgresql.enabled (dev by default).
  ignoreDifferences:
    - kind: Secret
      name: {{cookiecutter.project_name}}-postgresql-auth
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
