# Argo CD Application for the prod environment.
# Argo reconciles from main, so nothing reaches the cluster until a PR merges.
# The chart refuses to render until values-prod.yaml names an image tag
# (promote-to-prod opens the PR that sets it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{cookiecutter.project_name}}-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # CHANGE-ME: the git URL of this repository.
    repoURL: https://github.com/CHANGE-ME/{{cookiecutter.project_name}}.git
    targetRevision: main
    path: deployment/helm/{{cookiecutter.project_name}}
    helm:
      releaseName: {{cookiecutter.project_name}}
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{cookiecutter.project_name}}-prod
  # The bundled Postgres's credentials Secret is generated on the first sync
  # (Argo CD renders without cluster access, so every render would otherwise
  # produce a new password the database volume no longer accepts): keep the
  # live values. Only exists when postgresql.enabled (dev by default).
  ignoreDifferences:
    - kind: Secret
      name: {{cookiecutter.project_name}}-postgresql-auth
      jsonPointers:
        - /data
  # Production has NO automated sync (a human syncs it): after the values-prod.yaml
  # PR merges, an operator syncs the application in Argo CD.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
