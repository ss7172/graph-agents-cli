# CI for every pull request (make it a required status check on main): lint,
# unit and integration tests, the API-policy check, and the eval gate when a
# dataset exists. This file is copied verbatim (not rendered); project settings,
# including where graph-agents-cli is installed from (GRAPH_AGENTS_CLI_SPEC),
# come from .github/agent.env.

name: pr_checks

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Tests and the eval gate run against the deterministic fake model unless
      # the repository provides a real provider (repository variables/secrets).
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER || 'fake' }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'fake' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      CHECKPOINTER: memory
      AUTH_POLICY: shared-bearer
      API_KEY: ci-test-key
      GRAPH_AGENTS_CLI_API_KEY: ci-test-key
      APP_ENV: ci
      TRACING_ENABLED: "false"
      GRAPH_AGENTS_CLI_NO_UPDATE_CHECK: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load project settings
        # GITHUB_ENV accepts only NAME=VALUE lines: comments and blank lines are dropped.
        run: |
          if [ -f .github/agent.env ]; then
            { grep -Ev '^[[:space:]]*(#|$)' .github/agent.env || true; } >> "$GITHUB_ENV"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration -q

      - name: graph-agents-cli lint (code and API-policy check)
        run: |
          : "${GRAPH_AGENTS_CLI_SPEC:?GRAPH_AGENTS_CLI_SPEC is not set in .github/agent.env}"
          uvx --from "$GRAPH_AGENTS_CLI_SPEC" graph-agents-cli lint

      - name: Eval gate
        run: |
          : "${GRAPH_AGENTS_CLI_SPEC:?GRAPH_AGENTS_CLI_SPEC is not set in .github/agent.env}"
          if ls tests/eval/datasets/*.json >/dev/null 2>&1; then
            uvx --from "$GRAPH_AGENTS_CLI_SPEC" graph-agents-cli eval run
          else
            echo "No dataset under tests/eval/datasets; skipping the eval gate."
          fi
