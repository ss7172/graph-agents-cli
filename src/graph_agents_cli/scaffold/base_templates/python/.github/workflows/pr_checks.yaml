# CI for every pull request (make it a required status check on main): lint,
# unit and integration tests, the API-policy check, and the eval gate when a
# dataset exists. This file is copied verbatim (not rendered); project settings,
# including where graph-agents-cli is installed from (GRAPH_AGENTS_CLI_SPEC),
# come from .github/agent.env.
#
# Models: the tests always run against the deterministic fake model. The eval
# gate uses the project's real provider (create_params in
# graph-agents-cli-manifest.yaml) when that provider's key is a repository
# secret, or the MODEL_PROVIDER / MODEL_NAME repository variables when set;
# JUDGE_MODEL_PROVIDER / JUDGE_MODEL_NAME / JUDGE_BASE_URL variables and a
# JUDGE_API_KEY secret pick a separate judge. On the fake model the gate only
# checks the plumbing, and the run says so with a warning.
#
# The gate steps run the CLI's own `lint` and `eval run`: project extensions
# cannot override them here (GRAPH_AGENTS_CLI_DISABLE_OVERRIDES=1).

name: pr_checks

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MODEL_PROVIDER: fake
      MODEL_NAME: fake
      CHECKPOINTER: memory
      AUTH_POLICY: shared-bearer
      API_KEY: ci-test-key
      GRAPH_AGENTS_CLI_API_KEY: ci-test-key
      APP_ENV: ci
      TRACING_ENABLED: "false"
      GRAPH_AGENTS_CLI_NO_UPDATE_CHECK: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load project settings
        run: |
          # .github/agent.env is data and is never sourced: each NAME=VALUE line is
          # checked and copied to GITHUB_ENV, so a value may hold spaces or shell
          # metacharacters (a PEP 508 install spec, for example). Comment and blank
          # lines are skipped; blanks around the value, one pair of quotes around it
          # and a trailing " # comment" are dropped (no escapes, no expansion).
          file=.github/agent.env
          if [ ! -f "$file" ]; then
            echo "::error file=$file::$file is missing: it holds the project settings these workflows read." >&2
            exit 1
          fi
          lineno=0
          while IFS= read -r line || [ -n "$line" ]; do
            lineno=$((lineno + 1))
            line="${line%$'\r'}"
            if [ "$lineno" -eq 1 ]; then
              line="${line#$'\xef\xbb\xbf'}"
            fi
            if [[ "$line" =~ ^[[:space:]]*(#|$) ]]; then
              continue
            fi
            if ! [[ "$line" =~ ^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*=(.*)$ ]]; then
              echo "::error file=$file,line=$lineno::expected NAME=VALUE, got: $line" >&2
              exit 1
            fi
            name="${BASH_REMATCH[1]}"
            value="${BASH_REMATCH[2]}"
            case "$name" in
              GITHUB_* | RUNNER_* | ACTIONS_* | PATH | HOME | BASH_ENV | ENV | NODE_OPTIONS | LD_*)
                echo "::error file=$file,line=$lineno::$name cannot be set from $file." >&2
                exit 1
                ;;
            esac
            value="${value#"${value%%[![:space:]]*}"}"
            quote="${value:0:1}"
            if [ "$quote" = '"' ] || [ "$quote" = "'" ]; then
              rest="${value:1}"
              if [[ "$rest" != *"$quote"* ]]; then
                echo "::error file=$file,line=$lineno::$name: unterminated $quote quote." >&2
                exit 1
              fi
              value="${rest%%"$quote"*}"
            else
              value="${value%%[[:space:]]#*}"
              value="${value%"${value##*[![:space:]]}"}"
            fi
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done < "$file"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration -q

      - name: graph-agents-cli lint (code and API-policy check)
        env:
          GRAPH_AGENTS_CLI_DISABLE_OVERRIDES: "1"
        run: |
          : "${GRAPH_AGENTS_CLI_SPEC:?GRAPH_AGENTS_CLI_SPEC is not set in .github/agent.env}"
          uvx --from "$GRAPH_AGENTS_CLI_SPEC" graph-agents-cli lint

      - name: Eval gate
        env:
          GRAPH_AGENTS_CLI_DISABLE_OVERRIDES: "1"
          REPO_MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          REPO_MODEL_NAME: ${{ vars.MODEL_NAME }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          JUDGE_MODEL_PROVIDER: ${{ vars.JUDGE_MODEL_PROVIDER }}
          JUDGE_MODEL_NAME: ${{ vars.JUDGE_MODEL_NAME }}
          JUDGE_BASE_URL: ${{ vars.JUDGE_BASE_URL }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
        run: |
          : "${GRAPH_AGENTS_CLI_SPEC:?GRAPH_AGENTS_CLI_SPEC is not set in .github/agent.env}"
          if ! ls tests/eval/datasets/*.json >/dev/null 2>&1; then
            echo "No dataset under tests/eval/datasets; skipping the eval gate."
            exit 0
          fi
          manifest=graph-agents-cli-manifest.yaml
          project_provider="$(yq -r '.create_params.model_provider // ""' "$manifest")"
          project_model="$(yq -r '.create_params.model // ""' "$manifest")"
          provider="${REPO_MODEL_PROVIDER:-$project_provider}"
          model="$REPO_MODEL_NAME"
          if [ -z "$model" ] && [ "$provider" = "$project_provider" ]; then
            model="$project_model"
          fi
          case "$provider" in
            openai) key_var=OPENAI_API_KEY ;;
            anthropic) key_var=ANTHROPIC_API_KEY ;;
            gemini) key_var=GOOGLE_API_KEY ;;
            openai-compatible) key_var=MODEL_API_KEY ;;
            *) key_var="" ;;
          esac
          # A provider named by the repository variable is used as is (a local
          # openai-compatible server may need no key); the project's own
          # provider only when its key secret is present.
          if [ "$provider" != fake ] && { [ -n "$REPO_MODEL_PROVIDER" ] || { [ -n "$key_var" ] && [ -n "${!key_var:-}" ]; }; }; then
            if [ -z "$model" ]; then
              echo "::error::Set the MODEL_NAME repository variable: MODEL_PROVIDER=$provider differs from the project's provider ($project_provider)." >&2
              exit 1
            fi
            export MODEL_PROVIDER="$provider" MODEL_NAME="$model"
          fi
          judge="$(yq -r '.judge.provider // ""' tests/eval/eval_config.yaml 2>/dev/null || true)"
          judge="${judge:-${JUDGE_MODEL_PROVIDER:-$MODEL_PROVIDER}}"
          echo "Eval gate: agent model ${MODEL_PROVIDER}/${MODEL_NAME}, judge provider ${judge}."
          if [ "$MODEL_PROVIDER" = fake ] || [ "$judge" = fake ]; then
            message="The eval gate ran on the fake model (agent: ${MODEL_PROVIDER}, judge: ${judge}): it checks the plumbing, not answer quality. Add the ${key_var:-provider key} repository secret (or set the MODEL_PROVIDER / JUDGE_MODEL_PROVIDER variables) for a real quality gate."
            echo "::warning title=Eval gate is not a quality signal::${message}"
            {
              echo "### :warning: Eval gate is not a quality signal"
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          uvx --from "$GRAPH_AGENTS_CLI_SPEC" graph-agents-cli eval run
