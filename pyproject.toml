[project]
name = "graph-agents-cli"
version = "0.2.0"
description = "CLI and skills for building, evaluating, and deploying LangGraph agents on self-hosted Kubernetes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [{ name = "graph-agents-cli contributors" }]
keywords = ["langgraph", "agents", "kubernetes", "helm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1,<9",
    "rich>=13.7,<15",
    "pyyaml>=6.0,<7",
    "cookiecutter>=2.6,<3",
    "jinja2>=3.1,<4",
    "requests>=2.32,<3",
    "httpx>=0.27,<1",
    "packaging>=24.0",
    "pydantic>=2.7,<3",
    "psutil>=5.9",
    "filelock>=3.13",
    "python-dotenv>=1.0,<2",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
a2a = ["a2a-sdk[http-server]>=1.0,<2"]
langsmith = ["langsmith>=0.3"]

[project.scripts]
graph-agents-cli = "graph_agents_cli.main:main"

[project.urls]
Homepage = "https://github.com/ss7172/graph-agents-cli"
Issues = "https://github.com/ss7172/graph-agents-cli/issues"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "respx>=0.21",
    "pyfakefs>=5.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_agents_cli"]
# Templates, skills, locks and schemas ship inside the wheel so `setup` and
# `create` work offline (disconnected installs). Hatch includes every file under the package
# directory; nested .gitignore files belong to the templates and are data.
artifacts = ["src/graph_agents_cli/**"]

[tool.hatch.build.targets.sdist]
include = ["/src/graph_agents_cli", "/schemas", "/skills", "/LICENSE", "/NOTICE", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/graph_agents_cli/scaffold/agents", "src/graph_agents_cli/scaffold/base_templates", "src/graph_agents_cli/scaffold/deployment_targets", "src/graph_agents_cli/skills/data", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: renders projects, installs dependencies, or runs helm; opt in with -m slow"]
